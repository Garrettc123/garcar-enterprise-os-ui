name: ui-check
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  html:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: node --check server.mjs && node --check tests.mjs
      - name: Run application regression suite
        run: npm test
