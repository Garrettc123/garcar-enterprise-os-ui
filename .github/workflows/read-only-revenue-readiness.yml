name: Garcar read-only revenue readiness
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/verify-live-readiness.mjs'
      - 'scripts/verify-live-readiness.test.mjs'
      - '.github/workflows/read-only-revenue-readiness.yml'
permissions:
  contents: read
concurrency:
  group: garcar-readonly-readiness
  cancel-in-progress: true
jobs:
  contract-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/verify-live-readiness.test.mjs
  live-read-only:
    if: github.event_name == 'workflow_dispatch'
    needs: contract-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/verify-live-readiness.mjs
